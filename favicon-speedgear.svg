<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C28"/>
      <stop offset="100%" stop-color="#12121B"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#DD0200"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE4E8"/>
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#38384E" stroke-width="4"/>

  <!-- Speed Gear Outer Teeth -->
  <g filter="url(#gearShadow)" opacity="0.95">
    <!-- 8 Gear Teeth -->
    <path d="M 236 40 L 276 40 L 284 80 L 228 80 Z" fill="url(#redGrad)" />
    <path d="M 236 472 L 276 472 L 284 432 L 228 432 Z" fill="url(#redGrad)" />
    <path d="M 40 236 L 40 276 L 80 284 L 80 228 Z" fill="url(#redGrad)" />
    <path d="M 472 236 L 472 276 L 432 284 L 432 228 Z" fill="url(#redGrad)" />
    
    <!-- Diagonal Teeth -->
    <path d="M 103 118 L 132 89 L 168 118 L 139 147 Z" fill="url(#redGrad)" />
    <path d="M 380 394 L 409 365 L 445 394 L 416 423 Z" fill="url(#redGrad)" />
    <path d="M 394 103 L 423 132 L 394 168 L 365 139 Z" fill="url(#redGrad)" />
    <path d="M 118 380 L 89 409 L 118 445 L 147 416 Z" fill="url(#redGrad)" />

    <!-- Gear Ring Rim -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#redGrad)" stroke-width="26" stroke-dasharray="14 8"/>
    <circle cx="256" cy="256" r="162" fill="none" stroke="#323246" stroke-width="6"/>
  </g>

  <!-- Speed Streaks / Velocity Lines -->
  <path d="M 64 210 L 160 210" stroke="#DD0200" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 50 256 L 140 256" stroke="#DD0200" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M 72 302 L 150 302" stroke="#DD0200" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Official Waena Jaya Monogram 'WJ' Precision Vector Emblem (Center) -->
  <g id="wj-monogram" transform="translate(6, 6) scale(0.98)">
    <!-- Left Ribbon: Outer stem and first bowl of W (Signature Red) -->
    <path d="M 172 325 L 145 195 C 140 170 170 170 175 195 L 205 305 C 215 338 250 338 265 305 L 278 285" fill="none" stroke="url(#redGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Ribbon: Second bowl of W, tall stem, and J loop (Crisp Metallic White) -->
    <path d="M 242 268 L 268 308 C 280 342 318 342 332 305 L 380 180 C 390 155 425 165 422 202 C 418 230 385 235 375 205 L 325 295" fill="none" stroke="url(#silverGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Pin Accent Spark -->
  <circle cx="256" cy="256" r="10" fill="#25D366"/>
  <circle cx="256" cy="256" r="5" fill="#FFFFFF"/>
</svg>
